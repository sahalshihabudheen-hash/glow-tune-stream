<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NYRA</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #101010; color: #f5f5f5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 32px; gap: 14px; }
    img { width: 160px; height: 160px; border-radius: 32px; margin-bottom: 8px; }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 700; }
    p { margin: 0; max-width: 28ch; line-height: 1.5; color: #a3a3a3; }
    button { margin-top: 12px; padding: 14px 32px; border: 0; border-radius: 999px;
      background: #ef6c44; color: #101010; font-size: 1rem; font-weight: 700; }
    button:active { transform: scale(.97); }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="NYRA" width="160" height="160">
    <h1>You're offline</h1>
    <p>NYRA can't reach the internet. Check your connection and try again.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    // The app passes the page that failed to load as #retry=<url>.
    var params = new URLSearchParams(location.hash.slice(1));
    var target = params.get('retry');
    // Only ever navigate to https pages (never javascript:, data:, etc.).
    if (!target || !/^https:\/\//i.test(target)) target = null;

    function retry() {
      if (target) location.replace(target);
    }
    document.getElementById('retry').addEventListener('click', retry);
    window.addEventListener('online', retry); // reconnect -> reload automatically
  </script>
</body>
</html>
