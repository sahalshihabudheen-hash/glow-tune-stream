<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080d"/>
      <stop offset="50%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="goldGlow" cx="20%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffd300" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#ffd300" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffd300" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffd300"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffd300"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Glow Auras -->
  <rect width="1200" height="630" fill="url(#goldGlow)"/>
  <rect width="1200" height="630" fill="url(#purpleGlow)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>

  <!-- High-Tech Grid Accent -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Top Navigation / Brand Pill -->
  <g transform="translate(100, 60)">
    <!-- Pill container -->
    <rect x="0" y="0" width="280" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffd300" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="21" cy="21" r="5" fill="#ffd300" filter="url(#neonGlow)"/>
    <text x="36" y="26" class="font-sans" font-size="13" font-weight="800" fill="#ffd300" letter-spacing="0.22em">FEEL THE PULSE</text>
    <rect x="185" y="10" width="80" height="22" rx="11" fill="#ffd300" fill-opacity="0.15"/>
    <text x="225" y="25" class="font-sans" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.1em">LIVE STREAM</text>
  </g>

  <!-- Top Right Domain Badge -->
  <g transform="translate(850, 60)">
    <rect x="0" y="0" width="250" height="42" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="125" y="26" class="font-mono" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">nyra-music-player.vercel.app</text>
  </g>

  <!-- Left Main Hero Branding -->
  <g transform="translate(100, 160)">
    <!-- Brand Title -->
    <text x="0" y="70" class="font-sans" font-size="76" font-weight="900" fill="url(#goldText)" letter-spacing="-0.03em">
      NYRA MUSIC
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="125" class="font-sans" font-size="26" font-weight="600" fill="#f1f5f9" letter-spacing="-0.01em">
      Next-Gen Music Player &amp; Audio Streaming
    </text>

    <!-- Feature Description Paragraph -->
    <text x="0" y="170" class="font-sans" font-size="17" font-weight="400" fill="#94a3b8">
      Stream millions of songs in lossless high-fidelity audio. Experience dynamic
    </text>
    <text x="0" y="196" class="font-sans" font-size="17" font-weight="400" fill="#94a3b8">
      beat-reactive neon visuals, AI Mood DJ, 3D Music Universe, and offline mode.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 240)">
      <!-- Pill 1: Lossless Audio -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="165" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffd300" stroke-opacity="0.3"/>
        <text x="82" y="24" class="font-sans" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">✨ Lossless Audio</text>
      </g>
      <!-- Pill 2: AI Mood DJ -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#a855f7" stroke-opacity="0.4"/>
        <text x="75" y="24" class="font-sans" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">🤖 AI Mood DJ</text>
      </g>
      <!-- Pill 3: Visualizers -->
      <g transform="translate(345, 0)">
        <rect x="0" y="0" width="165" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#06b6d4" stroke-opacity="0.4"/>
        <text x="82" y="24" class="font-sans" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">⚡ Beat Reactive</text>
      </g>
      <!-- Pill 4: Free Streaming -->
      <g transform="translate(525, 0)">
        <rect x="0" y="0" width="140" height="38" rx="19" fill="#ffd300" fill-opacity="0.15" stroke="#ffd300" stroke-width="1.2"/>
        <text x="70" y="24" class="font-sans" font-size="13" font-weight="800" fill="#ffd300" text-anchor="middle">100% FREE</text>
      </g>
    </g>
  </g>

  <!-- Right Visualizer & Holographic Audio Graphic -->
  <g transform="translate(770, 160)" filter="url(#softShadow)">
    <!-- Glass Vinyl Background Disc -->
    <circle cx="160" cy="160" r="160" fill="#0f111a" stroke="#252836" stroke-width="2"/>
    <circle cx="160" cy="160" r="130" fill="none" stroke="#1f2230" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="160" cy="160" r="95" fill="none" stroke="#2a2e42" stroke-width="1.5"/>
    <circle cx="160" cy="160" r="60" fill="#ffd300" fill-opacity="0.2" stroke="#ffd300" stroke-width="2"/>
    <circle cx="160" cy="160" r="16" fill="#090a10"/>

    <!-- Dynamic Neon Equalizer Visualizer Bars around Disc -->
    <g transform="translate(20, 20)">
      <rect x="0" y="120" width="8" height="40" rx="4" fill="url(#waveGrad)"/>
      <rect x="16" y="90" width="8" height="100" rx="4" fill="url(#waveGrad)"/>
      <rect x="32" y="60" width="8" height="160" rx="4" fill="url(#waveGrad)"/>
      <rect x="48" y="100" width="8" height="80" rx="4" fill="url(#waveGrad)"/>
      <rect x="64" y="40" width="8" height="200" rx="4" fill="url(#waveGrad)"/>
      <rect x="80" y="80" width="8" height="120" rx="4" fill="url(#waveGrad)"/>
      <rect x="200" y="80" width="8" height="120" rx="4" fill="url(#waveGrad)"/>
      <rect x="216" y="40" width="8" height="200" rx="4" fill="url(#waveGrad)"/>
      <rect x="232" y="100" width="8" height="80" rx="4" fill="url(#waveGrad)"/>
      <rect x="248" y="60" width="8" height="160" rx="4" fill="url(#waveGrad)"/>
      <rect x="264" y="90" width="8" height="100" rx="4" fill="url(#waveGrad)"/>
      <rect x="280" y="120" width="8" height="40" rx="4" fill="url(#waveGrad)"/>
    </g>

    <!-- Floating Play Button Glow Overlay -->
    <circle cx="160" cy="160" r="42" fill="#ffd300" filter="url(#neonGlow)"/>
    <polygon points="152,146 174,160 152,174" fill="#090a10"/>
  </g>

  <!-- Bottom Visualizer Wave Floor -->
  <g transform="translate(100, 520)" opacity="0.6">
    <rect x="0" y="10" width="5" height="15" rx="2.5" fill="#ffd300"/>
    <rect x="12" y="5" width="5" height="25" rx="2.5" fill="#ffd300"/>
    <rect x="24" y="0" width="5" height="35" rx="2.5" fill="#ffd300"/>
    <rect x="36" y="8" width="5" height="20" rx="2.5" fill="#ffd300"/>
    <rect x="48" y="2" width="5" height="30" rx="2.5" fill="#ffd300"/>
    <rect x="60" y="12" width="5" height="12" rx="2.5" fill="#ffd300"/>
    <rect x="72" y="4" width="5" height="28" rx="2.5" fill="#ffd300"/>
    <rect x="84" y="0" width="5" height="35" rx="2.5" fill="#ffd300"/>
    <rect x="96" y="8" width="5" height="20" rx="2.5" fill="#ffd300"/>
  </g>
</svg>
